admin_role_id = -1
staff_member_role_id = -1

# put the id of your server here
guild_id = -1

# put cogs you don't want to use here, like: ["forb_or_borb.py", "greetings.py"]
ignored_cogs = [ ]

# the category temp modmail channels should spawn in
modmail_category_id = -1
# the channel the bot should log tickets to
modmail_logs_channel_id = -1

# the prefix for prefix commands
prefix = "$"
