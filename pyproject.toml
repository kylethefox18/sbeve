[project]
name = "sbeve"
version = "0.1.0"
description = "A discord bot that does stuff sometimes"
readme = "README.md"
authors = [
    { name = "kylethefox18", email = "kylethefox18@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "discord-py==2.7.1",
    "frozenlist==1.8.0",
    "idna==3.20",
    "multidict==6.9.1",
    "propcache==0.5.4",
    "python-dotenv==1.2.3",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[project.scripts]
bot = "sbeve.bot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["."]
